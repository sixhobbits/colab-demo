<svg width="100%" height="100%" viewBox="0 0 1200 530" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }


    .reveal-chunk-1 { animation: reveal-chunk-1 24s linear infinite; }
    @keyframes reveal-chunk-1 {
      0%, 0% { opacity: 0; }
      2%, 98% { opacity: 1; }
      100% { opacity: 0; }
    }

    .reveal-chunk-2 { animation: reveal-chunk-2 24s linear infinite; }
    @keyframes reveal-chunk-2 {
      0%, 24% { opacity: 0; }
      26%, 98% { opacity: 1; }
      100% { opacity: 0; }
    }

    .reveal-chunk-3 { animation: reveal-chunk-3 24s linear infinite; }
    @keyframes reveal-chunk-3 {
      0%, 49% { opacity: 0; }
      51%, 98% { opacity: 1; }
      100% { opacity: 0; }
    }

    .reveal-chunk-4 { animation: reveal-chunk-4 24s linear infinite; }
    @keyframes reveal-chunk-4 {
      0%, 74% { opacity: 0; }
      76%, 98% { opacity: 1; }
      100% { opacity: 0; }
    }

    .reveal-check-1 { animation: reveal-check-1 24s linear infinite; }
    @keyframes reveal-check-1 {
      0%, 44% { opacity: 0; }
      46%, 98% { opacity: 1; }
      100% { opacity: 0; }
    }

    .reveal-check-2 { animation: reveal-check-2 24s linear infinite; }
    @keyframes reveal-check-2 {
      0%, 44% { opacity: 0; }
      46%, 98% { opacity: 1; }
      100% { opacity: 0; }
    }

    .reveal-check-3 { animation: reveal-check-3 24s linear infinite; }
    @keyframes reveal-check-3 {
      0%, 69% { opacity: 0; }
      71%, 98% { opacity: 1; }
      100% { opacity: 0; }
    }

    .reveal-check-4 { animation: reveal-check-4 24s linear infinite; }
    @keyframes reveal-check-4 {
      0%, 94% { opacity: 0; }
      96%, 98% { opacity: 1; }
      100% { opacity: 0; }
    }

    .active-pair { animation: active-pair 24s linear infinite; }
    @keyframes active-pair {
      0%, 40% { opacity: 0; }
      42%, 46% { opacity: 1; }
      48%, 100% { opacity: 0; }
    }

    .active-3 { animation: active-3 24s linear infinite; }
    @keyframes active-3 {
      0%, 65% { opacity: 0; }
      67%, 71% { opacity: 1; }
      73%, 100% { opacity: 0; }
    }

    .active-4 { animation: active-4 24s linear infinite; }
    @keyframes active-4 {
      0%, 90% { opacity: 0; }
      92%, 96% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }

    .active-status-none { animation: active-status-none 24s linear infinite; }
    @keyframes active-status-none {
      0%, 6% { opacity: 0; }
      8%, 22% { opacity: 1; }
      24%, 100% { opacity: 0; }
    }

    .active-status-pair { animation: active-status-pair 24s linear infinite; }
    @keyframes active-status-pair {
      0%, 30% { opacity: 0; }
      32%, 46% { opacity: 1; }
      48%, 100% { opacity: 0; }
    }

    .active-status-3 { animation: active-status-3 24s linear infinite; }
    @keyframes active-status-3 {
      0%, 55% { opacity: 0; }
      57%, 71% { opacity: 1; }
      73%, 100% { opacity: 0; }
    }

    .active-status-4 { animation: active-status-4 24s linear infinite; }
    @keyframes active-status-4 {
      0%, 80% { opacity: 0; }
      82%, 96% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
  .gear { animation: gear-turn 8s linear infinite; transform-origin: 600px 280px; }
  @keyframes gear-turn {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .pawl { animation: pawl-lift 0.666667s ease-in-out infinite; transform-origin: 545px 207px; }
  @keyframes pawl-lift {
    0%, 8% { transform: rotate(0deg); }
    58%, 82% { transform: rotate(-12deg); }
    100% { transform: rotate(0deg); }
  }

  </style>
  <rect x="0" y="0" width="1200" height="530" fill="#f8f8f2" />

  <text x="600" y="44" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22"
    font-weight="600" fill="#34342f">Each update to the transcript checks off zero or more talking points.</text>

  <rect x="30" y="78" width="500" height="432" rx="16" fill="#ececE5"
    stroke="#d8d8cf" stroke-width="2" />
  <text x="60" y="116" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#c98a2e">
    LIVE TRANSCRIPT
  </text>
  <text x="60" y="144" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7c7c77">
    ElevenLabs or Whisper adds new speech here
  </text>

    <g class="reveal-chunk-1">
      <rect x="58" y="160" width="444" height="58" rx="9" fill="#f8f8f2"
        stroke="#d8d8cf" stroke-width="1.5" />
      <rect x="58" y="160" width="5" height="58" rx="2.5" fill="#c98a2e" />
      <text x="78" y="184" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#34342f">
        <tspan x="78">“Before I start, thank you for joining us today.</tspan>
        <tspan x="78" dy="20">We have a few ideas to work through together.”</tspan>
      </text>
    </g>

    <g class="reveal-chunk-2">
      <rect x="58" y="228" width="444" height="58" rx="9" fill="#f8f8f2"
        stroke="#d8d8cf" stroke-width="1.5" />
      <rect x="58" y="228" width="5" height="58" rx="2.5" fill="#c98a2e" />
      <text x="78" y="252" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#34342f">
        <tspan x="78">“The tool beside me is Intelliprompter. It listens</tspan>
        <tspan x="78" dy="20">while I present and marks points after I cover them.”</tspan>
      </text>
    </g>

    <g class="reveal-chunk-3">
      <rect x="58" y="296" width="444" height="58" rx="9" fill="#f8f8f2"
        stroke="#d8d8cf" stroke-width="1.5" />
      <rect x="58" y="296" width="5" height="58" rx="2.5" fill="#c98a2e" />
      <text x="78" y="320" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#34342f">
        <tspan x="78">“As I keep speaking, the complete transcript so far</tspan>
        <tspan x="78" dy="20">goes to Jev for review, not just my last line.”</tspan>
      </text>
    </g>

    <g class="reveal-chunk-4">
      <rect x="58" y="364" width="444" height="58" rx="9" fill="#f8f8f2"
        stroke="#d8d8cf" stroke-width="1.5" />
      <rect x="58" y="364" width="5" height="58" rx="2.5" fill="#c98a2e" />
      <text x="78" y="388" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#34342f">
        <tspan x="78">“Each remaining requirement gets a score out of five,</tspan>
        <tspan x="78" dy="20">and a point is done when all its requirements are met.”</tspan>
      </text>
    </g>
  <text x="60" y="462" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7c7c77">
    Each request uses the full transcript shown above.
  </text>

  <g class="gear">
    <rect x="596" y="214" width="8" height="20" rx="2"
      fill="#5d76a2" transform="rotate(0 600 280)" /><rect x="596" y="214" width="8" height="20" rx="2"
      fill="#5d76a2" transform="rotate(30 600 280)" /><rect x="596" y="214" width="8" height="20" rx="2"
      fill="#5d76a2" transform="rotate(60 600 280)" /><rect x="596" y="214" width="8" height="20" rx="2"
      fill="#5d76a2" transform="rotate(90 600 280)" /><rect x="596" y="214" width="8" height="20" rx="2"
      fill="#5d76a2" transform="rotate(120 600 280)" /><rect x="596" y="214" width="8" height="20" rx="2"
      fill="#5d76a2" transform="rotate(150 600 280)" /><rect x="596" y="214" width="8" height="20" rx="2"
      fill="#5d76a2" transform="rotate(180 600 280)" /><rect x="596" y="214" width="8" height="20" rx="2"
      fill="#5d76a2" transform="rotate(210 600 280)" /><rect x="596" y="214" width="8" height="20" rx="2"
      fill="#5d76a2" transform="rotate(240 600 280)" /><rect x="596" y="214" width="8" height="20" rx="2"
      fill="#5d76a2" transform="rotate(270 600 280)" /><rect x="596" y="214" width="8" height="20" rx="2"
      fill="#5d76a2" transform="rotate(300 600 280)" /><rect x="596" y="214" width="8" height="20" rx="2"
      fill="#5d76a2" transform="rotate(330 600 280)" />
    <circle cx="600" cy="280" r="51" fill="#e8eef6" stroke="#5d76a2"
      stroke-width="3" />
    <circle cx="600" cy="280" r="25" fill="#f8f8f2" stroke="#5d76a2"
      stroke-width="2" />
  </g>
  <text x="600" y="174" text-anchor="middle" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11"
    fill="#6f9b52">ONE-WAY RATCHET</text>
  <line x1="545" y1="184" x2="545" y2="207" stroke="#6f9b52"
    stroke-width="3" stroke-linecap="round" />
  <circle cx="545" cy="207" r="7" fill="#6f9b52" />
  <g class="pawl">
    <path d="M550 209 L583 220" fill="none" stroke="#6f9b52"
      stroke-width="7" stroke-linecap="round" />
    <polygon points="592,219 581,214 582,226" fill="#6f9b52" />
  </g>
  <text x="600" y="360" text-anchor="middle" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"
    font-weight="600" fill="#5d76a2">Jev scores</text>
  <text x="600" y="381" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12"
    fill="#6f9b52">the app keeps checks</text>

  <rect x="670" y="78" width="500" height="432" rx="16" fill="#ececE5"
    stroke="#d8d8cf" stroke-width="2" />
  <text x="700" y="116" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6f9b52">
    TELEPROMPTER CHECKLIST
  </text>
  <text x="700" y="151" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600"
    fill="#34342f">Introduce Intelliprompter</text>

    <g>
      <rect x="712" y="168" width="408" height="58" rx="10" fill="#ececE5"
        stroke="#d8d8cf" stroke-width="2" />
      <rect class="active-pair" x="712" y="168" width="408" height="58" rx="10"
        fill="#fff8ea" stroke="#c98a2e" stroke-width="2" />
      <rect x="734" y="187" width="18" height="18" rx="4" fill="none"
        stroke="#7c7c77" stroke-width="2" />
      <text x="770" y="205" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#34342f">
        Say its name
      </text>
      <g class="reveal-check-1">
        <rect x="734" y="187" width="18" height="18" rx="4"
          fill="#6f9b52" stroke="#6f9b52" stroke-width="2" />
        <path d="M738 196 l4 4 l7 -9" fill="none" stroke="#f8f8f2"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <g>
      <rect x="712" y="234" width="408" height="58" rx="10" fill="#ececE5"
        stroke="#d8d8cf" stroke-width="2" />
      <rect class="active-pair" x="712" y="234" width="408" height="58" rx="10"
        fill="#fff8ea" stroke="#c98a2e" stroke-width="2" />
      <rect x="734" y="253" width="18" height="18" rx="4" fill="none"
        stroke="#7c7c77" stroke-width="2" />
      <text x="770" y="271" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#34342f">
        Explain what it does
      </text>
      <g class="reveal-check-2">
        <rect x="734" y="253" width="18" height="18" rx="4"
          fill="#6f9b52" stroke="#6f9b52" stroke-width="2" />
        <path d="M738 262 l4 4 l7 -9" fill="none" stroke="#f8f8f2"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  <text x="700" y="329" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600"
    fill="#34342f">Explain the scoring loop</text>

    <g>
      <rect x="712" y="346" width="408" height="58" rx="10" fill="#ececE5"
        stroke="#d8d8cf" stroke-width="2" />
      <rect class="active-3" x="712" y="346" width="408" height="58" rx="10"
        fill="#fff8ea" stroke="#c98a2e" stroke-width="2" />
      <rect x="734" y="365" width="18" height="18" rx="4" fill="none"
        stroke="#7c7c77" stroke-width="2" />
      <text x="770" y="383" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#34342f">
        Send the full transcript
      </text>
      <g class="reveal-check-3">
        <rect x="734" y="365" width="18" height="18" rx="4"
          fill="#6f9b52" stroke="#6f9b52" stroke-width="2" />
        <path d="M738 374 l4 4 l7 -9" fill="none" stroke="#f8f8f2"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <g>
      <rect x="712" y="412" width="408" height="58" rx="10" fill="#ececE5"
        stroke="#d8d8cf" stroke-width="2" />
      <rect class="active-4" x="712" y="412" width="408" height="58" rx="10"
        fill="#fff8ea" stroke="#c98a2e" stroke-width="2" />
      <rect x="734" y="431" width="18" height="18" rx="4" fill="none"
        stroke="#7c7c77" stroke-width="2" />
      <text x="770" y="449" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#34342f">
        Score each requirement
      </text>
      <g class="reveal-check-4">
        <rect x="734" y="431" width="18" height="18" rx="4"
          fill="#6f9b52" stroke="#6f9b52" stroke-width="2" />
        <path d="M738 440 l4 4 l7 -9" fill="none" stroke="#f8f8f2"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <g class="active-status-none">
      <rect x="930" y="96" width="190" height="32" rx="16" fill="#f7ecec"
        stroke="#b5555a" stroke-width="1.5" />
      <text x="1025" y="117" text-anchor="middle" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5"
        fill="#b5555a">NO CHECKLIST CHANGE</text>
    </g>

    <g class="active-status-pair">
      <rect x="930" y="96" width="190" height="32" rx="16" fill="#eef4e8"
        stroke="#6f9b52" stroke-width="1.5" />
      <text x="1025" y="117" text-anchor="middle" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5"
        fill="#6f9b52">2 ITEMS COVERED</text>
    </g>

    <g class="active-status-3">
      <rect x="930" y="96" width="190" height="32" rx="16" fill="#eef4e8"
        stroke="#6f9b52" stroke-width="1.5" />
      <text x="1025" y="117" text-anchor="middle" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5"
        fill="#6f9b52">1 ITEM COVERED</text>
    </g>

    <g class="active-status-4">
      <rect x="930" y="96" width="190" height="32" rx="16" fill="#eef4e8"
        stroke="#6f9b52" stroke-width="1.5" />
      <text x="1025" y="117" text-anchor="middle" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5"
        fill="#6f9b52">FINAL ITEM COVERED</text>
    </g>

</svg>
